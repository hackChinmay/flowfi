<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowFi - Personal Finance Tracker</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="description" content="Track expenses, manage money, and understand spending behavior with FlowFi" />
    <meta name="author" content="FlowFi" />

    <!-- Security & Privacy Hardening -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com https://lh3.googleusercontent.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com wss://*.firebaseio.com http://127.0.0.1:* http://localhost:*; frame-src 'self' https://*.firebaseapp.com; object-src 'none'; base-uri 'self';"
    />

    <!-- Local self-hosted metadata to prevent third-party referrer tracking -->
    <meta property="og:title" content="FlowFi - Personal Finance Tracker" />
    <meta property="og:description" content="Track expenses, manage money, and understand spending behavior" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FlowFi - Personal Finance Tracker" />
    <meta name="twitter:image" content="/logo.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
